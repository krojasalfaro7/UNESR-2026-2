<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNESR 2026-2 · Home</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-root="">
<nav class="top" id="nav"></nav>
<main>
  <h1 id="titulo"></h1>
  <p class="sub" id="sub"></p>

  <section class="kpis" id="kpis"></section>

  <section class="card">
    <h2>Avance del lapso</h2>
    <div class="bar"><i id="prog"></i></div>
    <div class="row"><span id="ini"></span><span id="pct"></span><span id="fin"></span></div>
  </section>

  <section class="card">
    <h2>Calendario académico</h2>
    <div id="hitos"></div>
  </section>

  <h2>Materias</h2>
  <section class="mats" id="mats"></section>

  <section class="card">
    <h2>Horario semanal</h2>
    <div id="horario"></div>
  </section>

  <section class="card">
    <h2>Enlaces útiles</h2>
    <div id="enlaces"></div>
  </section>

  <section class="card" id="card-privado" hidden>
    <h2>Perfil académico <span class="muted">· solo tú</span></h2>
    <div id="perfil"></div>
    <details>
      <summary>Editar datos privados (JSON)</summary>
      <p><label>Importar perfil desde archivo: <input type="file" id="importar" accept=".json,application/json"></label></p>
      <textarea id="json" rows="16" spellcheck="false"></textarea>
      <p><button class="btn" id="guardar" type="button">Guardar</button> <span class="muted" id="msg"></span></p>
    </details>
  </section>

  <footer>Fuente: constancias de inscripción y de estudio (29/09/2026) y calendario académico oficial 2026-2 (<a href="https://github.com/krojasalfaro7/UNESR-2026-2/blob/develop/Documentos/CALENDARIO.md">detalle</a>). Datos en <code>assets/data.js</code>.</footer>
</main>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script type="module" src="assets/privado.js"></script>
</body>
</html>
